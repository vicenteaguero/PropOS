name: CI

# Gate for every push and PR: lint + unit tests on the backend, typecheck +
# build on the frontend. Integration tests are excluded here — they need a live
# Supabase project and burn LLM tokens, so they run in the `integration` job on
# a nightly schedule and on demand.
#
# Coverage is enforced. The threshold in pyproject.toml is the measured floor,
# so a PR that adds uncovered code fails this job instead of quietly diluting
# the number. Raise the floor when coverage rises; do not lower it to go green.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pytest (unit + coverage gate)
        run: poetry run pytest -q --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (eslint + prettier + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Typecheck
        run: npm run typecheck

      # No --passWithNoTests. Combined with a glob that skipped `.test.tsx`, it
      # reported "Unit tests ✓" for a run that collected nothing at all.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
