name: CI

# Gate for every push and PR: lint + unit tests on the backend, typecheck +
# build on the frontend. Integration tests are excluded (they need a live
# Supabase project). Coverage runs but does not fail the build yet — the gate in
# pyproject.toml is 70% while the suite sits at ~53%; ratchet it up instead of
# lowering the pyproject value.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pytest (unit, no coverage gate)
        run: poetry run pytest -q --no-cov

  frontend:
    name: Frontend (eslint + prettier + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Typecheck
        run: npm run typecheck

      # No --passWithNoTests. Combined with a glob that skipped `.test.tsx`, it
      # reported "Unit tests ✓" for a run that collected nothing at all.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
