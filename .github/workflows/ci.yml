name: CI

# Gate for every push and PR: lint + unit tests on the backend, typecheck +
# build on the frontend. Integration tests are excluded here — they need a live
# Supabase project and burn LLM tokens, so they run in the `integration` job on
# a nightly schedule and on demand.
#
# Coverage is enforced. The threshold in pyproject.toml is the measured floor,
# so a PR that adds uncovered code fails this job instead of quietly diluting
# the number. Raise the floor when coverage rises; do not lower it to go green.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}
  # Nightly, for the integration job only. 06:00 UTC = 02:00 in Chile.
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs on a feature branch are noise; on main they are the record
  # of what shipped, so let those finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pytest (unit + coverage gate)
        run: poetry run pytest -q --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (eslint + prettier + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json,md}"

      - name: Typecheck
        run: npm run typecheck

      # No --passWithNoTests. Combined with a glob that skipped `.test.tsx`, it
      # reported "Unit tests ✓" for a run that collected nothing at all.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migrations (naming + ordering)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Static checks only: no database is involved, so this runs on every PR.
      # Catches duplicate sequence numbers and unterminated $$ bodies, which
      # used to surface only when `make migrate` hit the live database.
      - name: Check migrations
        run: python scripts/check_migrations.py

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reports, does not gate. A transitive advisory published overnight should
    # show up in the run summary, not block an unrelated PR. Triage it, then
    # tighten this to a real gate once the backlog is at zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # No venv cache here on purpose: pip-audit gets installed into this
      # environment and must not leak into the cache the backend job restores.
      - name: pip-audit
        working-directory: backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
          poetry run python -m pip install --quiet pip-audit
          poetry run pip-audit --desc off

  integration:
    name: Integration (live Supabase + LLM)
    # Never on push or PR: these tests hit the real Supabase project and spend
    # Groq tokens, so they run nightly and on demand instead of on every commit.
    # Until this job existed the 50 integration tests ran only when somebody
    # remembered `make test-agent` — the last recorded results were 3 months old.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Same DB, mirror schema. conftest refuses to run if PostgREST does not
      # expose it, so a misconfigured run cannot write to production.
      AGENT_TEST_SCHEMA: propos_test
      SUPABASE_DB_SCHEMA: propos_test
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # A missing secret must not read as a passing suite. Report exactly what
      # is absent and skip the run instead of failing on a confusing traceback.
      - name: Check required secrets
        id: secrets
        run: |
          missing=""
          for key in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY GROQ_API_KEY; do
            eval "value=\${$key:-}"
            [ -z "$value" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration tests skipped::Missing repo secrets:$missing. Set them with 'gh secret set <NAME>'. Nothing was verified by this run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pytest (integration)
        if: steps.secrets.outputs.ready == 'true'
        run: poetry run pytest tests/integration -m 'integration and not whisper' -q --no-cov

      - name: Upload agent capability matrix
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-results
          path: backend/tests/integration/agent/results.jsonl
          if-no-files-found: warn
