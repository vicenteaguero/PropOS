<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to report non-zero.
         Without it `apple-mobile-web-app-status-bar-style=black-translucent` below still
         draws the standalone PWA under the status bar while every inset reads 0, so the
         bottom nav lands under the home indicator and headers land under the notch.
         interactive-widget=resizes-content is CHROMIUM-ONLY. On Android it shrinks the
         LAYOUT viewport when the soft keyboard opens, so `fixed bottom-0` chrome rides
         above it. iOS Safari — including installed PWAs — ignores it entirely and never
         shrinks anything; there the keyboard just covers the page, which is why
         shared/lib/viewport-store reads `visualViewport` instead of trusting layout.
         Keep this flag: it costs iOS nothing and Android needs it. But note the coupling
         it creates — because Android's innerHeight shrinks, `covered` is ~0 there and the
         ONLY evidence of a keyboard is the `shrunk` branch, which depends entirely on a
         correct module-level `restHeight` (and on resetting it when the device rotates). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropOS" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- No preload for /pdfjs/pdf.worker.min.mjs. `rel=preload` is not a hint,
         it is an immediate high-priority fetch, and that file is 1.046 kB —
         downloaded on every cold visit, competing with the bundle that actually
         paints the first screen, for a viewer most sessions never open.
         document-preview.tsx points pdfjs at it when the viewer mounts, and the
         CacheFirst rule for /pdfjs/* (one year, see vite.config.ts) keeps every
         subsequent open instant. -->
    <title>PropOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
