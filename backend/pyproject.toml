[tool.poetry]
name = "propos-backend"
version = "0.1.0"
description = "PropOS Backend API"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# Ceiling on purpose. 0.134+ replaces the flat `app.routes` list with an
# `_IncludedRouter` wrapper that keeps the sub-router's UNPREFIXED paths and
# applies the prefix at match time, so nothing walking `app.routes` can see a
# full path any more. Three security tests do exactly that — "every route under
# this prefix declares its scope" among them — and they go green-but-blind, not
# red, when the traversal finds nothing. Lift this only together with a
# rewrite of that traversal.
fastapi = "~0.133"
# Security floor, not a feature need: FastAPI only requires >=0.46, which is
# the version carrying ten open advisories. Pinned up so a resolve cannot
# quietly walk back down to it.
starlette = ">=1.3.1"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = {extras = ["email"], version = "^2.9"}
pydantic-settings = "^2.6"
supabase = "^2.10"
python-dotenv = "^1.0"
structlog = "^24.4"
pywebpush = "^2.0"
pypdf = "^6.16"
python-multipart = ">=0.0.32,<0.1"
openai = "^1.50"
anthropic = "^0.39"
httpx = "^0.27"
sqlglot = "^25.0"
rapidfuzz = "^3.10"
psycopg = {extras = ["binary"], version = "^3.2"}
pypdfium2 = "^5.8.0"
pillow = "^12.2.0"
pillow-heif = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
pytest-cov = "^6.0"
factory-boy = "^3.3"
httpx = "^0.27"
respx = "^0.21"
ruff = "^0.11"
pandas = "^2.2"
seaborn = "^0.13"
matplotlib = "^3.9"
jupyterlab = "^4.2"
beautifulsoup4 = "^4.12"
lxml = "^6.1"
openpyxl = "^3.1"
python-calamine = "^0.3"
jupyter-mcp-server = "^1.0.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# cov-fail-under is the *measured* floor, not a target. It sat at 70 while the
# suite ran at 53, so every caller passed --no-cov to get a green run and the
# gate never fired once. A ratchet only works if it is armed: raise this number
# when coverage rises, never lower it to make a red run go green.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=53 -m 'not integration'"
markers = [
    "integration: hits real Supabase + LLM providers (slow, costs tokens)",
    "whisper: hits Groq Whisper (rate-limited 20 req/min, only run when measuring STT quality)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
