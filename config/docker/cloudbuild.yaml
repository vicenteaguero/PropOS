# Backend build + deploy. Fired by the `propos-api-deploy` trigger on push to
# main (paths backend/**, config/docker/**), or manually via `make deploy-backend`.
#
# Two things this file deliberately does at runtime instead of statically:
#   1. Tags the image with the commit SHA as well as :latest, so a bad deploy can
#      be rolled back to a specific revision. Manual builds have no SHORT_SHA, so
#      they fall back to a timestamp tag.
#   2. Builds --set-secrets from the secrets that actually exist in Secret
#      Manager. A secret listed here but missing makes `gcloud run deploy` fail,
#      which would mean the whole deploy pipeline breaks the moment we add a
#      not-yet-provisioned integration. Instead, features stay dark until their
#      secret is created, and the next deploy picks it up with no edit here.
#   3. Smoke tests the deployed revision against /health/ready and fails the
#      build when it does not come up. A skipped secret is not an error (see 2),
#      but a revision that cannot reach the database is, and until now nothing in
#      the pipeline turned that into a red build.
#   4. Waits for GitHub Actions to go green on this commit before deploying.
#      This trigger fires on push to main independently of CI, so a commit that
#      broke the suite used to build and deploy anyway. Branch protection is the
#      usual fix and needs repo-admin rights; gating here needs none. It runs in
#      parallel with the image build, so it costs wall-clock time only when CI is
#      slower than docker. Emergency override: _SKIP_CI_GATE=true.
#
# Sizing: one container serves the Kapso webhook, the Cloud Scheduler jobs and
# both Vercel frontends, and some handlers still call the synchronous Supabase
# client (plus a blocking 30s Whisper request) straight from the event loop. At
# --max-instances=1 a single audio transcription or email-sync run queues every
# other request behind it, including webhooks that Kapso retries and then drops.
# Three instances of 1Gi cost nothing while idle -- Cloud Run bills per request,
# and --min-instances stays 0 -- but they stop one slow handler from taking the
# whole service down. Change this file, not the live service: a
# `gcloud run services update` is overwritten by the next deploy.
steps:
  # python:3.12-slim rather than the gcloud builder: the gate is pure stdlib and
  # this image is ~45MB, so it starts before docker has finished pulling layers.
  - name: "python:3.12-slim"
    id: ci-gate
    waitFor: ["-"] # start immediately, in parallel with the image build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$_SKIP_CI_GATE" = "true" ]; then
          echo "!! _SKIP_CI_GATE=true — deploying without checking CI"
          exit 0
        fi
        python3 scripts/check_ci_status.py --repo "$_GH_REPO" --sha "$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    id: build-push
    waitFor: ["-"] # independent of the gate; only `deploy` waits for both
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TAG="$SHORT_SHA"
        if [ -z "$$TAG" ]; then TAG="manual-$$(date -u +%Y%m%d-%H%M%S)"; fi
        echo "$$TAG" > /workspace/image_tag
        echo "==> building $_IMAGE_BASE:$$TAG"
        docker pull "$_IMAGE_BASE:latest" || true
        DOCKER_BUILDKIT=1 docker build \
          --cache-from="$_IMAGE_BASE:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$_IMAGE_BASE:$$TAG" \
          -t "$_IMAGE_BASE:latest" \
          -f config/docker/backend.prod.Dockerfile \
          .
        docker push "$_IMAGE_BASE:$$TAG"
        docker push "$_IMAGE_BASE:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy
    waitFor: ["ci-gate", "build-push"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TAG="$$(cat /workspace/image_tag)"

        # ENV_VAR=secret-name pairs. Missing secrets are skipped, not fatal.
        PAIRS="SUPABASE_URL=supabase-url
        SUPABASE_ANON_KEY=supabase-anon-key
        SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key
        VAPID_PUBLIC_KEY=vapid-public-key
        VAPID_PRIVATE_KEY=vapid-private-key
        CEREBRAS_API_KEY=cerebras-api-key
        GROQ_API_KEY=groq-api-key
        ANTHROPIC_API_KEY=anthropic-api-key
        OPENAI_API_KEY=openai-api-key
        KAPSO_API_KEY=kapso-api-key
        KAPSO_WEBHOOK_SECRET=kapso-webhook-secret
        KAPSO_PHONE_NUMBER_ID=kapso-phone-number-id
        RESEND_API_KEY=resend-api-key
        INTERNAL_JOBS_SECRET=internal-jobs-secret
        AGENT_READONLY_DB_URL=agent-readonly-db-url
        EMAIL_IMAP_USER=email-imap-user
        EMAIL_IMAP_PASSWORD=email-imap-password"

        SECRETS=""
        for pair in $$PAIRS; do
          name="$${pair#*=}"
          if gcloud secrets describe "$$name" >/dev/null 2>&1; then
            SECRETS="$${SECRETS:+$$SECRETS,}$$pair:latest"
          else
            echo "skip secret (not provisioned): $$name"
          fi
        done
        echo "==> mounting secrets: $$SECRETS"

        gcloud run deploy propos-api \
          --image="$_IMAGE_BASE:$$TAG" \
          --region=$_REGION \
          --platform=managed \
          --allow-unauthenticated \
          --port=8000 \
          --min-instances=0 \
          --max-instances=3 \
          --memory=1Gi \
          --cpu=1 \
          --env-vars-file=config/docker/cloudrun-env.yaml \
          --set-secrets="$$SECRETS"

  - name: "gcr.io/cloud-builders/gcloud"
    id: smoke-test
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe propos-api --region=$_REGION --format='value(status.url)')"
        echo "==> smoke testing $$URL"

        # /health is a constant: it answers 200 with a rotated Supabase key, a
        # paused project or an unmounted secret. /health/ready reads a row and
        # checks the core secrets, so a build that produced a running-but-useless
        # revision goes red here instead of shipping green.
        for i in 1 2 3 4 5 6; do
          CODE="$$(curl -s --max-time 20 -o /workspace/ready.json -w '%{http_code}' "$$URL/health/ready" || echo 000)"
          echo "attempt $$i -> http=$$CODE"
          if [ "$$CODE" = "200" ]; then
            cat /workspace/ready.json; echo ""
            echo "==> revision is ready"
            exit 0
          fi
          sleep 10
        done

        echo "--- last response body ---"
        cat /workspace/ready.json 2>/dev/null || true
        echo ""
        echo "DEPLOY FAILED READINESS. Traffic is already on the new revision."
        echo "Roll back with:  make deploy-rollback REV=<previous-revision>"
        gcloud run revisions list --service=propos-api --region=$_REGION \
          --format='table(metadata.name,status.conditions[0].lastTransitionTime)' --limit=5 || true
        exit 1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _IMAGE_BASE: us-central1-docker.pkg.dev/propos-489401/propos/api
  _REGION: us-central1
  _GH_REPO: vicenteaguero/PropOS
  # Escape hatch for a deploy that cannot wait for CI (GitHub outage, incident
  # rollforward): gcloud builds submit --substitutions=_SKIP_CI_GATE=true
  _SKIP_CI_GATE: "false"
