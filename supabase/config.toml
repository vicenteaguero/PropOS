[api]
enabled = true
port = 54321
schemas = ["public", "propos_test"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

# Auth — applied to remote project via `supabase config push`.
# SMTP must still be set in the Supabase Dashboard (CLI only pushes a
# subset of auth config; SMTP secret is not safe in a tracked file).
[auth]
# Accounts are created by the service-role Admin API (UserService.create_user /
# invite_user, visitor_invitations). Self-signup was on, and the anon key ships
# inside the public JS bundle -- so anyone who opened devtools could register
# themselves into the project. Nothing in the product uses the signup path.
enable_signup = false
minimum_password_length = 8
site_url = "https://app.propos.cl"
additional_redirect_urls = [
  "https://app.propos.cl/auth/setup",
  "https://app.propos.cl/auth/recovery",
  "https://dev.propos.cl/auth/setup",
  "https://dev.propos.cl/auth/recovery",
  "https://prop-os-delta.vercel.app/auth/setup",
  "https://prop-os-delta.vercel.app/auth/recovery",
  "https://prop-os-edge.vercel.app/auth/setup",
  "https://prop-os-edge.vercel.app/auth/recovery",
  "http://localhost:5173/auth/setup",
  "http://localhost:5173/auth/recovery",
  "https://192.168.0.62:5443/auth/setup",
  "https://192.168.0.62:5443/auth/recovery",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Two mails per hour, project-wide, is the Supabase default for the built-in
# SMTP and it survived the switch to Resend. Three people setting a password on
# the same morning is enough to hit it.
[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false

# Custom SMTP via Resend. Activate when RESEND_API_KEY is set in .env.
# Push command:
#   set -a && . ./.env && set +a && \
#   SUPABASE_AUTH_SMTP_PASS="$RESEND_API_KEY" supabase config push --yes
# Until then, leave enabled = false (Supabase default SMTP, with "powered by Supabase" footer).
# CUIDADO: el PATCH de /config/auth trata este bloque como atomico. Mandar un
# solo campo (por ejemplo smtp_admin_email) borra host, port, user y pass, y el
# reset de contrasena pasa en silencio al SMTP interno de Supabase, que solo
# entrega a miembros del proyecto. Ademas el GET devuelve smtp_pass enmascarado
# como hex: reescribir lo que leiste deja la password invalida y /auth/v1/recover
# responde 500. La password correcta es la API key de Resend.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "no-reply@propos.cl"
sender_name = "PropOS"

[auth.email.template.invite]
subject = "Tu invitación a PropOS"
content_path = "./supabase/email-templates/invite.html"

[auth.email.template.recovery]
subject = "Restablecer tu contraseña en PropOS"
content_path = "./supabase/email-templates/recovery.html"

[auth.email.template.magic_link]
subject = "Tu link mágico para PropOS"
content_path = "./supabase/email-templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirmá tu nuevo correo en PropOS"
content_path = "./supabase/email-templates/email_change.html"

[auth.email.template.confirmation]
subject = "Confirmá tu correo en PropOS"
content_path = "./supabase/email-templates/confirmation.html"
